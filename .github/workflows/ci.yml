name: Beyragh CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


permissions:
  contents: read


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Server syntax
        run: node --check server/index.js

      - name: Public build
        run: npm run build

      - name: Admin build
        run: npm run build:admin

      - name: Core integration tests
        run: npm run test:core

      - name: Backup and restore test
        run: npm run test:backup