name: Beyragh Backend CI

on:
  push:
    branches: [main, develop, "release/**", "refactor/**"]
  pull_request:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Server syntax
        run: node --check server/index.js
      - name: Core integration tests
        run: npm run test:core
      - name: OTP service tests
        run: npm run test:otp
      - name: Customer portal tests
        run: npm run test:customer
      - name: Admin test OTP
        run: npm run test:admin-otp
      - name: Break-glass tests
        run: npm run test:break-glass
      - name: Reservation operations
        run: npm run test:reservation-ops
      - name: QR check-in
        run: npm run test:checkin
      - name: Attendance dashboard
        run: npm run test:attendance
      - name: Ticket checker management
        run: npm run test:checkers
      - name: Backup and restore
        run: npm run test:backup
