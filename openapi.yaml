          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  performanceId: { type: integer }
                  stats:
                    type: object
                    properties:
                      total: { type: integer }
                      admitted: { type: integer }
                      remaining: { type: integer }
                  recent:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      properties:
                        id: { type: integer }
