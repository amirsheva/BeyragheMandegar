        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Admin - Checkers]
      summary: Create a checker account
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, displayName, password]
              properties:
                username:
                  type: string
                  pattern: '^[a-z0-9._-]{3,40}$'
                  description: Normalized to lowercase before validation.
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 80
                password:
                  type: string
                  minLength: 10
                  maxLength: 200
                active: { type: boolean, default: true }
                allPerformances: { type: boolean, default: false }
                performanceIds:
                  type: array
                  items: { type: integer }
                  description: Used only when allPerformances is false; every id must exist.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  user: { $ref: '#/components/schemas/CheckerUser' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/checkers/{id}:
    patch:
      tags: [Admin - Checkers]
      summary: Update a checker account (partial)
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 2, maxLength: 80 }
                active: { type: boolean }
                allPerformances:
                  type: boolean
                  description: If true, all performance assignments are cleared.
                performanceIds:
                  type: array
                  items: { type: integer }
                  description: Used only when allPerformances resolves to false.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  user: { $ref: '#/components/schemas/CheckerUser' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/checkers/{id}/reset-password:
    post:
      tags: [Admin - Checkers]
      summary: Reset a checker's password
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 10, maxLength: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean, example: true } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  # ===========================================================
  # Admin - Dashboard
  # ===========================================================
  /api/admin/dashboard/stats:
    get:
      tags: [Admin - Checkin]
      summary: Top-level dashboard counters
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  shows: { type: integer }
                  productions: { type: integer, description: Same value as shows. }
                  performances: { type: integer }
                  reservations: { type: integer }
                  tickets: { type: integer, description: 'Sum of Reservation.count.' }
                  totalCapacity: { type: integer }
                  remainingCapacity: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/ServerError' }

  # ===========================================================
  # Admin - Test OTP
  # ===========================================================
  /api/admin/customer/test-otp/status:
    get:
      tags: [Admin - Test OTP]
      summary: Get test-OTP tool availability/config
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  enabled: { type: boolean }
                  provider: { type: string }
                  customerPortalEnabled: { type: boolean }
                  ttlSeconds: { type: integer, example: 300 }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/admin/customer/test-otp:
    post:
      tags: [Admin - Test OTP]
      summary: Reveal/regenerate the test OTP code for a phone's active challenge
      description: >
        Only works when ADMIN_TEST_OTP_ENABLED, CUSTOMER_PORTAL_ENABLED, and
        OTP_PROVIDER=noop are all true, and an active noop OTP challenge
        already exists for the phone (requested via the public "My
        Reservations" flow first).
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  challengeId: { type: integer }
                  code: { type: string, example: "483920" }
                  expiresInSeconds: { type: integer }
                  phoneMasked: { type: string, example: "0912***4567" }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "503": { $ref: '#/components/responses/ServerError' }
        "500": { $ref: '#/components/responses/ServerError' }
