  # ===========================================================
  /api/admin/performances:
    get:
      tags: [Admin - Performances]
      summary: List all performances
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PerformanceWithProduction' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Admin - Performances]
      summary: Create a performance (a "night")
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [production_id, date, time]
              properties:
                production_id: { type: integer, minimum: 1 }
                venue_id: { type: integer, minimum: 1, nullable: true }
                date: { type: string }
                time: { type: string }
                attendance_time: { type: string }
                end_time: { type: string }
                ticket_note: { type: string }
                capacity: { type: integer, minimum: 1, default: 300 }
                status: { type: string, default: active, description: '"archived" forces booking_enabled=false.' }
                booking_enabled: { type: boolean, default: true }
                label: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Performance' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/performances/{id}:
    patch:
      tags: [Admin - Performances]
      summary: Update a performance (partial)
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: >
                All fields optional. capacity, if provided, must stay >= the
                number of already-reserved seats (capacity - remaining_capacity);
                remaining_capacity is recalculated automatically.
              properties:
                capacity: { type: integer, minimum: 1 }
                production_id: { type: integer }
                venue_id: { type: integer, nullable: true }
                date: { type: string, nullable: true }
                time: { type: string, nullable: true }
                attendance_time: { type: string, nullable: true }
                end_time: { type: string, nullable: true }
                ticket_note: { type: string, nullable: true }
                status: { type: string, nullable: true, description: '"archived" forces booking_enabled=false.' }
                label: { type: string, nullable: true }
                booking_enabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Performance' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Admin - Performances]
      summary: Delete a performance (fails if it has reservations)
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean, example: true } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "500": { $ref: '#/components/responses/ServerError' }

  # ===========================================================
  # Admin - Reservations
  # ===========================================================
  /api/admin/reservations:
    get:
      tags: [Admin - Reservations]
      summary: List all reservations (no pagination/filtering; PII masked)
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminReservation' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/reservations/export:
    post:
      tags: [Admin - Reservations]
      summary: Export selected reservations as CSV
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  description: Max 5000 after de-duplication/filtering.
      responses:
        "200":
          description: CSV file (UTF-8 BOM, CRLF rows; national ID intentionally excluded)
          headers:
            X-Export-Count:
              schema: { type: integer }
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="beyragh-reservations-2026-10-06.csv"' }
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/reservations/{id}/status:
    patch:
      tags: [Admin - Reservations]
      summary: Confirm or cancel a reservation
      description: >
        cancelled→confirmed requires enough remaining capacity (409 if not);
        confirmed→cancelled releases the seats back to the performance.
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [confirmed, cancelled]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReservation' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "500": { $ref: '#/components/responses/ServerError' }

