      summary: SMS module overview counts
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates: { type: integer }
                  campaigns: { type: integer }
                  messages: { type: integer }
                  queued: { type: integer }
                  sent: { type: integer }
                  failed: { type: integer }
                  stats:
                    type: object
                    description: Duplicate of the counts above, nested.
                    properties:
                      templates: { type: integer }
                      campaigns: { type: integer }
                      messages: { type: integer }
                      queued: { type: integer }
                      sent: { type: integer }
                      failed: { type: integer }
                  provider: { type: string, example: noop }
                  transactionalEnabled: { type: boolean }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/ServerError' }

