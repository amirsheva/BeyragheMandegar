services:
  db:
    image: postgres:16
    container_name: beyragh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: beyragh
      POSTGRES_USER: beyragh
      POSTGRES_PASSWORD: beyragh
    ports:
      - "5432:5432"
    volumes:
      - beyragh-postgres-data:/var/lib/postgresql/data

volumes:
  beyragh-postgres-data:
