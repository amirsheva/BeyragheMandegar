# Public site + admin panel: beyraghmandegar.ir / www.beyraghmandegar.ir
# Serves the built SPA (dist/) and the admin build (dist/admin/) from the
# same origin. The frontend calls the API cross-origin at
# https://api.beyraghmandegar.ir (see src/lib/config.js), so no /api proxy
# is required here for the app to function — it's kept as a harmless
# same-origin fallback for local/staging use with VITE_API_BASE_URL="".
server {
    listen 80;
    listen [::]:80;
    server_name beyraghmandegar.ir www.beyraghmandegar.ir;

    root /opt/beyragh/frontend/dist;
    index index.html;

    # Ticket paths and Referer headers can contain private tracking codes.
    # Enable access logging only with a format that redacts both fields.
    access_log off;

    location = /api {
        access_log off;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        access_log off;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}


# API: api.beyraghmandegar.ir
# Pure reverse proxy to the Node backend on the loopback interface. The
# backend must stay bound to 127.0.0.1:4000 and never exposed directly.
server {
    listen 80;
    listen [::]:80;
    server_name api.beyraghmandegar.ir;

    access_log off;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
